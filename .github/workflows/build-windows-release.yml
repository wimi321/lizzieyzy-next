name: Build Windows Release
run-name: "Windows release ${{ inputs.release_tag }} | ${{ inputs.date_tag }} | prerelease=${{ inputs.release_prerelease }}"

on:
  workflow_dispatch:
    inputs:
      date_tag:
        description: Release date tag, for example 2026-03-24
        required: true
      release_tag:
        description: Existing GitHub release tag to upload into
        required: true
      release_prerelease:
        description: Exact pre-release state of the existing draft release
        required: true
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 280
    env:
      RELEASE_DATE_TAG: ${{ inputs.date_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.release_prerelease }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TARGET_SHA: ${{ github.sha }}
      RELEASE_GITHUB_REF: ${{ github.ref }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate release upload identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python scripts/validate_release_workflow_identity.py
          --date-tag "$RELEASE_DATE_TAG"
          --release-tag "$RELEASE_TAG"
          --prerelease "$RELEASE_PRERELEASE"
          --repository "$RELEASE_REPOSITORY"
          --target-sha "$RELEASE_TARGET_SHA"
          --github-ref "$RELEASE_GITHUB_REF"
          --require-draft

      - name: Generate app icons
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python scripts/generate_app_icons.py

      - name: Install packaging tools
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y
          choco install 7zip --no-progress -y

      - name: Build shaded jar
        shell: bash
        run: mvn -DskipTests package

      - name: Prepare bundled KataGo assets
        shell: bash
        env:
          PREPARE_WINDOWS_EXPERIMENTAL: 'true'
        run: |
          set -euo pipefail
          ./scripts/prepare_bundled_katago.sh

      - name: Build Windows installer and portable package
        id: release_metadata
        timeout-minutes: 240
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_BUILD_EXPERIMENTAL_PORTABLES: 'true'
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^next-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_prerelease="$RELEASE_PRERELEASE"
          if [[ "$release_prerelease" != "true" && "$release_prerelease" != "false" ]]; then
            echo "Unable to determine pre-release state for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release_prerelease=$release_prerelease" >> "$GITHUB_OUTPUT"

          serial="$RELEASE_TAG"
          serial="${serial##*.}"
          if [[ ! "$serial" =~ ^[0-9]+$ ]]; then
            serial="${GITHUB_RUN_ATTEMPT:-0}"
          fi
          WINDOWS_BUILD_SERIAL="$serial" LIZZIE_RELEASE_PRERELEASE="$release_prerelease" \
            ./scripts/package_windows_exe.sh "$RELEASE_DATE_TAG" 1.0.0 target/lizzie-yzy2.5.3-shaded.jar "$RELEASE_TAG"

      - name: Validate public Windows assets
        shell: bash
        env:
          RELEASE_METADATA_PRERELEASE: ${{ steps.release_metadata.outputs.release_prerelease }}
        run: >-
          bash ./scripts/validate_release_assets.sh
          windows
          dist/release
          "$RELEASE_DATE_TAG"
          "$RELEASE_TAG"
          "$RELEASE_METADATA_PRERELEASE"

      - name: Audit Windows bundle UX checkpoints
        shell: bash
        run: |
          # Trace every assertion so a future packaging regression identifies the exact failed check.
          set -euxo pipefail
          note_file="dist/release-meta/${RELEASE_DATE_TAG}-windows64-install.txt"
          test -f "$note_file"
          grep -q "Release display version: $RELEASE_TAG" "$note_file"
          grep -q "Smart Optimize" "$note_file"
          grep -q "first launch should work offline" "$note_file"
          grep -q "qiyi71w/readboard v3.0.6" "$note_file"
          grep -q "JCEF browser runtime" "$note_file"
          grep -q "NVIDIA CUDA package for RTX 20/30/40/50" "$note_file"
          test -f "dist/windows/input-with-katago/engines/katago/windows-x64/katago.exe"
          test -f "dist/windows/input-with-katago/PROJECT_INFO.txt"
          test -f "dist/windows/input-with-katago/readboard/readboard.exe"
          test -f "dist/windows/input-with-katago/readboard/lizzieyzy-next-readboard-manifest.txt"
          test -f "dist/windows/input-with-katago/jcef-bundle/build_meta.json"
          test -f "dist/windows/input-with-katago/jcef-bundle/install.lock"
          test -f "dist/windows/input-with-katago/jcef-bundle/libcef.dll"
          test -f "dist/windows/input-with-katago/jcef-bundle/lizzieyzy-next-jcef-manifest.txt"
          grep -qx "release-tag=jcef-99c2f7a+cef-127.3.1+g6cbb30e+chromium-127.0.6533.100" "dist/windows/input-with-katago/jcef-bundle/lizzieyzy-next-jcef-manifest.txt"
          grep -qx "platform=windows-amd64" "dist/windows/input-with-katago/jcef-bundle/lizzieyzy-next-jcef-manifest.txt"
          grep -qx "sha256=6d0466b9d5a2c4607a8a9eded1b5b9f77ca4514eadb68a1333b19053a462ceac" "dist/windows/input-with-katago/jcef-bundle/lizzieyzy-next-jcef-manifest.txt"
          grep -qx "release-tag=v3.0.6" "dist/windows/input-with-katago/readboard/lizzieyzy-next-readboard-manifest.txt"
          grep -qx "asset-name=readboard-github-release-v3.0.6.zip" "dist/windows/input-with-katago/readboard/lizzieyzy-next-readboard-manifest.txt"
          grep -qx "sha256=1ba4c265f560cd988be24f4ea0eeb29516883f42ece477bd32b72f8bccf6565d" "dist/windows/input-with-katago/readboard/lizzieyzy-next-readboard-manifest.txt"
          grep -qx 'KataGo release: v1.18.1' "dist/windows/input-with-katago/engines/katago/VERSION.txt"
          grep -qx 'Windows bundle: katago-v1.18.1-eigen-windows-x64.zip' "dist/windows/input-with-katago/engines/katago/VERSION.txt"
          grep -qx 'Model source: kata1-tf3-b11c768-s11500M-d6163M.bin.gz' "dist/windows/input-with-katago/engines/katago/VERSION.txt"
          grep -qx 'Model architecture: transformer' "dist/windows/input-with-katago/engines/katago/VERSION.txt"
          grep -qx 'Minimum KataGo version: 1.17.0' "dist/windows/input-with-katago/engines/katago/VERSION.txt"
          test "$(sha256sum "dist/windows/input-with-katago/weights/default.bin.gz" | awk '{print $1}')" = \
            "73f6454eba62d2f6d099af8ce66d8c3fde6225e223c55817da0627590e98b0ae"
          test -f "dist/windows/input-opencl/engines/katago/windows-x64/katago.exe"
          test -f "dist/windows/input-opencl/PROJECT_INFO.txt"
          test -f "dist/windows/input-opencl/readboard/readboard.exe"
          test -f "dist/windows/input-opencl/readboard/lizzieyzy-next-readboard-manifest.txt"
          grep -qx 'Windows OpenCL bundle: katago-v1.18.1-opencl-windows-x64.zip' "dist/windows/input-opencl/engines/katago/VERSION.txt"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/LizzieYzy Next.exe"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/PROJECT_INFO.txt"
          grep -q "java-options=-Dlizzie.next.version=$RELEASE_TAG" "dist/windows/app-image-with-katago/LizzieYzy Next/app/LizzieYzy Next.cfg"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/readboard/readboard.exe"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/readboard/lizzieyzy-next-readboard-manifest.txt"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/jcef-bundle/build_meta.json"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/jcef-bundle/install.lock"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/jcef-bundle/libcef.dll"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/app/jcef-bundle/lizzieyzy-next-jcef-manifest.txt"
          test -f "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/LizzieYzy Next OpenCL.exe"
          test -f "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/app/PROJECT_INFO.txt"
          grep -q "java-options=-Dlizzie.next.version=$RELEASE_TAG" "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/app/LizzieYzy Next OpenCL.cfg"
          test -f "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/app/readboard/readboard.exe"
          test -f "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/runtime/bin/java.exe"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/LizzieYzy Next NVIDIA.exe"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/PROJECT_INFO.txt"
          grep -q "java-options=-Dlizzie.next.version=$RELEASE_TAG" "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/LizzieYzy Next NVIDIA.cfg"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/readboard/readboard.exe"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/runtime/bin/java.exe"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/katago.exe"
          test -f "dist/windows/input-nvidia/PROJECT_INFO.txt"
          test -f "dist/windows/input-nvidia/readboard/readboard.exe"
          test -f "dist/windows/input-nvidia/readboard/lizzieyzy-next-readboard-manifest.txt"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/cudart64_12.dll"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/cublas64_12.dll"
          test -f "dist/windows/app-image-without.engine/LizzieYzy Next/LizzieYzy Next.exe"
          test -f "dist/windows/app-image-without.engine/LizzieYzy Next/app/PROJECT_INFO.txt"
          grep -q "java-options=-Dlizzie.next.version=$RELEASE_TAG" "dist/windows/app-image-without.engine/LizzieYzy Next/app/LizzieYzy Next.cfg"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/cublasLt64_12.dll"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/cudnn64_9.dll"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/z.dll"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/lizzieyzy-next-nvidia-runtime-manifest.txt"
          grep -q "Profile: cuda12.8-cudnn9" "dist/windows/input-nvidia/engines/katago/windows-x64/lizzieyzy-next-nvidia-runtime-manifest.txt"
          find "dist/windows/input-nvidia/engines/katago/windows-x64" -maxdepth 1 -type f -name 'nvJitLink*.dll' | grep -q .
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/nvrtc64_120_0.dll"
          test -f "dist/windows/input-nvidia/engines/katago/windows-x64/nvrtc-builtins64_128.dll"
          grep -Eq '^- CUDA NVRTC: 12\.8\.61 \| .* \| sha256=e43603b09f8a52d681ceb814c00b655af19da53692ab91671dabbf8071c8f93d[[:space:]]*$' \
            "dist/windows/input-nvidia/engines/katago/windows-x64/lizzieyzy-next-nvidia-runtime-manifest.txt"
          grep -qx "nvidia" "dist/windows/input-nvidia/engines/katago/windows-x64/lizzieyzy-next-engine-backend.txt"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/cudart64_12.dll"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/cublas64_12.dll"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/cublasLt64_12.dll"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/cudnn64_9.dll"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/z.dll"
          find "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64" -maxdepth 1 -type f -name 'nvJitLink*.dll' | grep -q .
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/nvrtc64_120_0.dll"
          test -f "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/nvrtc-builtins64_128.dll"
          experimental_specs=(
            "experimental.directml|LizzieYzy Next DirectML Experimental|directml|windows-directml"
            "experimental.openvino|LizzieYzy Next OpenVINO Experimental|openvino|windows-openvino"
            "experimental.rocm.gfx103x|LizzieYzy Next ROCm gfx103x Experimental|rocm-gfx103x|windows-rocm-gfx103x"
            "experimental.rocm.gfx110x|LizzieYzy Next ROCm gfx110x Experimental|rocm-gfx110x|windows-rocm-gfx110x"
            "experimental.rocm.gfx1151|LizzieYzy Next ROCm gfx1151 Experimental|rocm-gfx1151|windows-rocm-gfx1151"
            "experimental.rocm.gfx120x|LizzieYzy Next ROCm gfx120x Experimental|rocm-gfx120x|windows-rocm-gfx120x"
          )
          for spec in "${experimental_specs[@]}"; do
            IFS='|' read -r flavor app_name backend catalog_id <<<"$spec"
            asset_sha="$(python3 scripts/katago_asset_catalog.py get "assets.${catalog_id}.sha256")"
            engine_dir="dist/windows/app-image-${flavor}/${app_name}/app/engines/katago/windows-x64"
            test -f "$engine_dir/katago.exe"
            test -f "$engine_dir/lizzieyzy-next-katago-engine-manifest.txt"
            grep -qx "$backend" "$engine_dir/lizzieyzy-next-engine-backend.txt"
            grep -qx "KataGo release: v1.18.1" "$engine_dir/lizzieyzy-next-katago-engine-manifest.txt"
            grep -qx "Asset SHA-256: $asset_sha" "$engine_dir/lizzieyzy-next-katago-engine-manifest.txt"
            test -f "dist/windows/app-image-${flavor}/${app_name}/${app_name}.exe"
            test -f "dist/release/${RELEASE_DATE_TAG}-windows64.${flavor}.portable.zip"
            test "$(sha256sum "dist/windows/app-image-${flavor}/${app_name}/app/weights/default.bin.gz" | awk '{print $1}')" = \
              "73f6454eba62d2f6d099af8ce66d8c3fde6225e223c55817da0627590e98b0ae"
          done
          test -d "dist/windows/app-image-experimental.rocm.gfx103x/LizzieYzy Next ROCm gfx103x Experimental/app/engines/katago/windows-x64/rocblas"
          test -d "dist/windows/app-image-experimental.rocm.gfx103x/LizzieYzy Next ROCm gfx103x Experimental/app/engines/katago/windows-x64/hipblaslt"
          test -f "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.7z.001"
          test -f "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.README.txt"
          test -f "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.manifest.json"
          test -f "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.sha256.txt"
          test -f "engines/katago/windows-x64-nvidia-tensorrt/lizzieyzy-next-katago-engine-manifest.txt"
          test -f "engines/katago/windows-x64-nvidia-tensorrt/katago-human-sl-cuda.exe"
          echo "e207abb6e2403f0f34e9f4cac6079b988bf853537367d18f899c4b246eeb044c  engines/katago/windows-x64-nvidia-tensorrt/katago-human-sl-cuda.exe" | sha256sum -c -
          grep -qx "KataGo release: v1.18.1" \
            "engines/katago/windows-x64-nvidia-tensorrt/lizzieyzy-next-katago-engine-manifest.txt"
          grep -qx "Asset SHA-256: 49b7229803b2ccee5205cc9d1f7b1a37790469405324de5e5acaafe7a8a9172a" \
            "engines/katago/windows-x64-nvidia-tensorrt/lizzieyzy-next-katago-engine-manifest.txt"
          grep -qx "HumanSL companion: katago-human-sl-cuda.exe" \
            "engines/katago/windows-x64-nvidia-tensorrt/lizzieyzy-next-katago-engine-manifest.txt"
          grep -qx "HumanSL companion SHA-256: e207abb6e2403f0f34e9f4cac6079b988bf853537367d18f899c4b246eeb044c" \
            "engines/katago/windows-x64-nvidia-tensorrt/lizzieyzy-next-katago-engine-manifest.txt"
          test -f "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/katago-human-sl-cuda.exe"
          echo "e207abb6e2403f0f34e9f4cac6079b988bf853537367d18f899c4b246eeb044c  dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/katago-human-sl-cuda.exe" | sha256sum -c -
          test -f "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/nvrtc64_120_0.dll"
          test -f "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/nvrtc-builtins64_128.dll"
          grep -Eq '^- CUDA NVRTC: 12\.8\.61 \| .* \| sha256=e43603b09f8a52d681ceb814c00b655af19da53692ab91671dabbf8071c8f93d[[:space:]]*$' \
            "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/lizzieyzy-next-nvidia-runtime-manifest.txt"
          grep -Eq '^- NVIDIA TensorRT: 10\.9\.0\.34 \| .* \| sha256=c2758eb60191f01a47b24f54700e5463f577ebe129cd18fe835d0aa9f1e1a16d[[:space:]]*$' \
            "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/lizzieyzy-next-nvidia-runtime-manifest.txt"
          grep -qx "KataGo release: v1.18.1" \
            "dist/windows/input-nvidia.tensorrt/engines/katago/VERSION.txt"
          grep -qx "Windows TensorRT bundle: katago-v1.18.1-trt10.9.0-cuda12.8-windows-x64.zip" \
            "dist/windows/input-nvidia.tensorrt/engines/katago/VERSION.txt"
          grep -q "Optional TensorRT split package for RTX 30 series and earlier" "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.README.txt"
          grep -q '"engineBackend": "nvidia-tensorrt"' "dist/release/${RELEASE_DATE_TAG}-windows64.nvidia.tensorrt.portable.manifest.json"
          test -f "dist/windows/input-without.engine/PROJECT_INFO.txt"
          test -f "dist/windows/input-without.engine/readboard/readboard.exe"
          test -f "dist/windows/input-without.engine/readboard/lizzieyzy-next-readboard-manifest.txt"
          test -f "dist/windows/app-image-without.engine/LizzieYzy Next/app/PROJECT_INFO.txt"
          test -f "dist/windows/app-image-without.engine/LizzieYzy Next/app/readboard/readboard.exe"
          test -f "dist/windows/app-image-without.engine/LizzieYzy Next/runtime/bin/java.exe"
          test -f "dist/windows/app-image-with-katago/LizzieYzy Next/runtime/bin/java.exe"
          shopt -s nullglob
          jcef_bundle_count=0
          for jcef_bundle in dist/windows/input-*/jcef-bundle dist/windows/app-image-*/*/app/jcef-bundle; do
            test -f "$jcef_bundle/build_meta.json"
            test -f "$jcef_bundle/install.lock"
            test -f "$jcef_bundle/libcef.dll"
            test -f "$jcef_bundle/jcef.dll"
            test -f "$jcef_bundle/jcef_helper.exe"
            test -f "$jcef_bundle/lizzieyzy-next-jcef-manifest.txt"
            grep -qx "release-tag=jcef-99c2f7a+cef-127.3.1+g6cbb30e+chromium-127.0.6533.100" "$jcef_bundle/lizzieyzy-next-jcef-manifest.txt"
            grep -qx "platform=windows-amd64" "$jcef_bundle/lizzieyzy-next-jcef-manifest.txt"
            jcef_bundle_count=$((jcef_bundle_count + 1))
          done
          if (( jcef_bundle_count < 2 )); then
            echo "Expected bundled JCEF runtime in Windows inputs and app images"
            exit 1
          fi
          for app_cfg in \
            "dist/windows/app-image-with-katago/LizzieYzy Next/app/LizzieYzy Next.cfg" \
            "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/app/LizzieYzy Next OpenCL.cfg" \
            "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/LizzieYzy Next NVIDIA.cfg" \
            "dist/windows/app-image-without.engine/LizzieYzy Next/app/LizzieYzy Next.cfg"; do
            grep -q -- "java-options=-Xshare:auto" "$app_cfg"
            grep -q -- "java-options=-XX:InitialRAMPercentage=1.0" "$app_cfg"
            grep -q -- "java-options=-XX:MaxRAMPercentage=50.0" "$app_cfg"
            ! grep -q -- "java-options=-Xmx4096m" "$app_cfg"
            ! grep -q -- "SharedArchiveFile" "$app_cfg"
            if grep -qE 'sun\.java2d\.uiScale=1\.0|sun\.java2d\.uiScale\.enabled=false' "$app_cfg"; then
              echo "Windows package must not force Java UI scaling: $app_cfg"
              exit 1
            fi
          done
          test -f "dist/release-meta/${RELEASE_DATE_TAG}-windows64-runtime.json"
          grep -q '"optimized": true' "dist/release-meta/${RELEASE_DATE_TAG}-windows64-runtime.json"
          grep -q '"created": true' "dist/release-meta/${RELEASE_DATE_TAG}-windows64-runtime.json"
          for app_dir in dist/windows/app-image-*/*; do
            test -d "$app_dir"
            test ! -f "$app_dir/app/lizzieyzy-next-cds.jsa"
            test -f "$app_dir/runtime/bin/server/jvm.dll"
            test -f "$app_dir/runtime/bin/jabswitch.exe"
            test -f "$app_dir/runtime/bin/javaaccessbridge.dll"
            test -f "$app_dir/runtime/bin/windowsaccessbridge-64.dll"
            "$app_dir/runtime/bin/java.exe" --list-modules | grep -q '^jdk.accessibility@'
            "$app_dir/runtime/bin/java.exe" \
              -Xshare:auto \
              -XX:InitialRAMPercentage=1.0 \
              -XX:MaxRAMPercentage=50.0 \
              -version
          done
          for readboard_exe in \
            dist/windows/input-*/readboard/readboard.exe \
            dist/windows/app-image-*/*/app/readboard/readboard.exe; do
            grep -a -q 'level="asInvoker"' "$readboard_exe"
            if grep -a -q 'level="requireAdministrator"' "$readboard_exe"; then
              echo "readboard.exe must not request administrator privileges: $readboard_exe"
              exit 1
            fi
          done

      - name: Audit bundled Windows KataGo binary versions
        shell: bash
        run: |
          set -euo pipefail
          runtime_version_engines=(
            "dist/windows/app-image-with-katago/LizzieYzy Next/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-opencl/LizzieYzy Next OpenCL/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.directml/LizzieYzy Next DirectML Experimental/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.openvino/LizzieYzy Next OpenVINO Experimental/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.rocm.gfx103x/LizzieYzy Next ROCm gfx103x Experimental/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.rocm.gfx110x/LizzieYzy Next ROCm gfx110x Experimental/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.rocm.gfx1151/LizzieYzy Next ROCm gfx1151 Experimental/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-experimental.rocm.gfx120x/LizzieYzy Next ROCm gfx120x Experimental/app/engines/katago/windows-x64/katago.exe"
          )
          driver_gated_static_engines=(
            "dist/windows/app-image-nvidia/LizzieYzy Next NVIDIA/app/engines/katago/windows-x64/katago.exe"
            "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/katago-human-sl-cuda.exe"
          )
          tensorrt_engine="dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/katago.exe"
          for engine in "${runtime_version_engines[@]}"; do
            test -f "$engine"
            version_output="$("$engine" version 2>&1)"
            printf '%s\n%s\n' "$engine" "$version_output"
            grep -q 'KataGo v1\.18\.1' <<<"$version_output"
          done
          # CPU, OpenCL, ONNX and ROCm can report their version without initializing a
          # device. CUDA/TensorRT cannot pass the Windows loader on a hosted runner
          # without an NVIDIA display driver, so only those binaries use the static
          # marker audit after the runtime-file checks above.
          python3 scripts/audit_katago_binary_version.py \
            --expected-version 1.18.1 \
            --reject-version 1.17.0 \
            --reject-version 1.17.1 \
            --reject-version 1.17.2 \
            "${driver_gated_static_engines[@]}"
          python3 scripts/audit_katago_binary_version.py \
            --expected-version 1.18.1 \
            --reject-version 1.17.0 \
            --reject-version 1.17.1 \
            --reject-version 1.17.2 \
            "$tensorrt_engine"
          python3 scripts/audit_katago_package_metadata.py \
            --version-file "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/VERSION.txt" \
            --engine-manifest "dist/windows/app-image-nvidia.tensorrt/LizzieYzy Next NVIDIA TensorRT/app/engines/katago/windows-x64/lizzieyzy-next-katago-engine-manifest.txt" \
            --expected-version 1.18.1 \
            --expected-asset katago-v1.18.1-trt10.9.0-cuda12.8-windows-x64.zip

      - name: Smoke test bundled Windows app images
        shell: powershell
        run: |
          $appExe = Join-Path $PWD "dist\windows\app-image-with-katago\LizzieYzy Next\LizzieYzy Next.exe"
          & "$PWD\scripts\windows_smoke_test.ps1" -AppExe $appExe -WaitSeconds 60 -ProbeBoardSync
          $nvidiaExe = Join-Path $PWD "dist\windows\app-image-nvidia\LizzieYzy Next NVIDIA\LizzieYzy Next NVIDIA.exe"
          & "$PWD\scripts\windows_smoke_test.ps1" `
            -AppExe $nvidiaExe `
            -WaitSeconds 30 `
            -HealthyProcessSeconds 8 `
            -PreserveConfig `
            -LauncherOnly `
            -OpenAutoSetup
          $launcherOnlyApps = @(
            "dist\windows\app-image-opencl\LizzieYzy Next OpenCL\LizzieYzy Next OpenCL.exe",
            "dist\windows\app-image-without.engine\LizzieYzy Next\LizzieYzy Next.exe",
            "dist\windows\app-image-experimental.directml\LizzieYzy Next DirectML Experimental\LizzieYzy Next DirectML Experimental.exe",
            "dist\windows\app-image-experimental.openvino\LizzieYzy Next OpenVINO Experimental\LizzieYzy Next OpenVINO Experimental.exe",
            "dist\windows\app-image-experimental.rocm.gfx103x\LizzieYzy Next ROCm gfx103x Experimental\LizzieYzy Next ROCm gfx103x Experimental.exe",
            "dist\windows\app-image-experimental.rocm.gfx110x\LizzieYzy Next ROCm gfx110x Experimental\LizzieYzy Next ROCm gfx110x Experimental.exe",
            "dist\windows\app-image-experimental.rocm.gfx1151\LizzieYzy Next ROCm gfx1151 Experimental\LizzieYzy Next ROCm gfx1151 Experimental.exe",
            "dist\windows\app-image-experimental.rocm.gfx120x\LizzieYzy Next ROCm gfx120x Experimental\LizzieYzy Next ROCm gfx120x Experimental.exe"
          )
          foreach ($relativePath in $launcherOnlyApps) {
            $launcherExe = Join-Path $PWD $relativePath
            & "$PWD\scripts\windows_smoke_test.ps1" `
              -AppExe $launcherExe `
              -WaitSeconds 30 `
              -HealthyProcessSeconds 8 `
              -PreserveConfig `
              -LauncherOnly
          }

      - name: Summarize Windows package size audit
        if: always()
        shell: bash
        run: |
          audit="dist/release-meta/${RELEASE_DATE_TAG}-windows64-package-size-audit.md"
          if [[ -f "$audit" ]]; then
            cat "$audit" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke test Windows upgrade install path
        timeout-minutes: 25
        shell: powershell
        run: |
          $inputDir = Join-Path $PWD "dist\windows\input-with-katago"
          $iconPath = Join-Path $PWD "packaging\icons\app-icon.ico"
          & "$PWD\scripts\windows_upgrade_smoke.ps1" `
            -InputDir $inputDir `
            -MainJar "lizzie-yzy2.5.3-shaded.jar" `
            -IconPath $iconPath `
            -UpgradeUuid "c2ef73ec-f99a-4f3d-b950-f52c0186122a"

      - name: Upload workflow metadata
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-meta
          path: |
            dist/release-meta/*windows64-*.txt
            dist/release-meta/*windows64-*.json
            dist/release-meta/*windows64-*.md

      - name: Upload Windows smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-logs
          path: |
            ${{ runner.temp }}/lizzieyzy-next-msi-smoke/logs/*
            dist/windows/app-image-with-katago/LizzieYzy Next/LastConsoleLogs_*.txt
            dist/windows/app-image-with-katago/LizzieYzy Next/LastErrorLogs_*.txt

      - name: Create run-bound release asset provenance
        shell: bash
        run: |
          python scripts/release_asset_provenance.py \
            --release-dir dist/release \
            --platform windows \
            --date-tag "$RELEASE_DATE_TAG" \
            --release-tag "$RELEASE_TAG" \
            --target-sha "$RELEASE_TARGET_SHA" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --output dist/release-meta/release-asset-provenance.json

      - name: Upload run-bound release asset provenance
        uses: actions/upload-artifact@v6
        with:
          name: release-asset-provenance-windows-attempt-${{ github.run_attempt }}
          path: dist/release-meta/release-asset-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_release_workflow_identity.py \
            --date-tag "$RELEASE_DATE_TAG" \
            --release-tag "$RELEASE_TAG" \
            --prerelease "$RELEASE_PRERELEASE" \
            --repository "$RELEASE_REPOSITORY" \
            --target-sha "$RELEASE_TARGET_SHA" \
            --github-ref "$RELEASE_GITHUB_REF" \
            --require-draft
          gh release upload "$RELEASE_TAG" \
            dist/release/*windows64*.installer.exe \
            dist/release/*windows64*.portable.zip \
            dist/release/*windows64.core-update.zip \
            dist/release/lizzieyzy-next-update-manifest.json \
            dist/release/*windows64.nvidia.tensorrt.portable.7z.* \
            dist/release/*windows64.nvidia.tensorrt.portable.README.txt \
            dist/release/*windows64.nvidia.tensorrt.portable.manifest.json \
            dist/release/*windows64.nvidia.tensorrt.portable.sha256.txt \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
