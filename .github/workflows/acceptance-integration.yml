name: Acceptance integration

on:
  pull_request:
    paths:
      - '.github/workflows/acceptance-integration.yml'
      - 'scripts/run_acceptance.py'
      - 'scripts/prepare_cpu_engine_acceptance.py'
      - 'src/main/resources/katago-assets.json'
      - 'src/test/java/featurecat/lizzie/gui/SgfUiAcceptanceIT.java'
      - 'src/test/java/featurecat/lizzie/gui/RealCpuEngineAcceptanceIT.java'
      - 'src/main/java/featurecat/lizzie/rules/SGFParser.java'
      - 'src/main/java/featurecat/lizzie/analysis/**'
      - 'src/test/java/featurecat/lizzie/rules/HandicapSavedAnalysisPipelineTest.java'
      - 'src/test/resources/featurecat/lizzie/gui/d3-*.sgf'
      - 'src/test/resources/featurecat/lizzie/gui/d4-*.sgf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-source-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub restricts Draft assets to push access. This job only reads JSON,
    # downloads bytes and verifies a digest; it never executes PR code or engines.
    permissions:
      contents: write
    outputs:
      has_source: ${{ steps.archive.outputs.has_source }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: src/main/resources/katago-assets.json
      - name: Read and verify the catalog-bound source archive only
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def select_archive_tag(releases, preferred, name, size, sha):
              if not isinstance(releases, list):
                  raise SystemExit('Invalid release inventory')
              exact_tags = []
              for release in releases:
                  tag = release.get('tag_name', '')
                  if not re.fullmatch(r'next-\d{4}-\d{2}-\d{2}\.[1-9]\d*', tag):
                      continue
                  rows = [row for row in release.get('assets', []) if row.get('name') == name]
                  exact = (len(rows) == 1 and rows[0].get('state') == 'uploaded'
                           and rows[0].get('size') == size
                           and rows[0].get('digest') == 'sha256:' + sha)
                  if tag == preferred and rows and not exact:
                      raise SystemExit('Requested release contains a mismatched source archive')
                  if exact and (tag == preferred or release.get('draft') is False):
                      exact_tags.append(tag)
              if preferred in exact_tags:
                  return preferred
              if exact_tags:
                  return exact_tags[0]
              raise SystemExit('No release contains the exact pinned source archive')

          catalog = json.loads(Path('src/main/resources/katago-assets.json').read_text())
          is_source = catalog.get('origin') == 'project-source-build'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('has_source=' + str(is_source).lower() + '\n')
          if is_source:
              repository = os.environ['EXPECTED_REPOSITORY']
              tag = catalog.get('engineReleaseTag', '')
              asset = catalog['assets']['linux-cpu']
              name = asset.get('assetName', '')
              sha = asset.get('sha256', '')
              size = asset.get('sizeBytes')
              if (catalog.get('engineReleaseRepository') != repository
                      or not re.fullmatch(r'next-\d{4}-\d{2}-\d{2}\.[1-9]\d*', tag)
                      or not re.fullmatch(r'katago-source-[0-9a-f]{12}-linux-cpu\.zip', name)
                      or not re.fullmatch(r'[0-9a-f]{64}', sha)
                      or type(size) is not int or not 0 < size < 100_000_000):
                  raise SystemExit('Invalid source archive identity')
              # A release-request PR precedes its new Draft tag. The CI-only
              # bootstrap may use identical bytes from an already public release,
              # never a different engine. Release packaging still requires its own tag.
              inventory = subprocess.run(
                  ['gh', 'api', f'repos/{repository}/releases?per_page=100'],
                  check=True, capture_output=True, text=True, timeout=120)
              source_tag = select_archive_tag(json.loads(inventory.stdout), tag, name, size, sha)
              destination = Path(os.environ['RUNNER_TEMP']) / 'verified-cpu-archive'
              destination.mkdir()
              subprocess.run(['gh', 'release', 'download', source_tag, '--repo', repository,
                              '--pattern', name, '--dir', str(destination)],
                             check=True, capture_output=True, timeout=480)
              archive = destination / name
              with archive.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              if archive.stat().st_size != size or digest != sha:
                  raise SystemExit('Source archive size or SHA-256 mismatch')
              print(f'Verified identical source CPU archive from {source_tag}; no executable was run')
          PY
      - uses: actions/upload-artifact@v6
        if: steps.archive.outputs.has_source == 'true'
        with:
          name: verified-cpu-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-cpu-archive/*.zip
          if-no-files-found: error
          retention-days: 1

  linux-sgf-cpu:
    needs: prepare-source-archive
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install isolated display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core fonts-noto-cjk
      - uses: actions/download-artifact@v6
        if: needs.prepare-source-archive.outputs.has_source == 'true'
        with:
          name: verified-cpu-archive-${{ github.run_id }}
          path: target/acceptance-assets/cache
      - name: Prepare verified Linux Eigen and default model
        run: python3 scripts/prepare_cpu_engine_acceptance.py --root target/acceptance-assets
      - name: Run SGF dialogs and real CPU process acceptance
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          manifest = Path('target/acceptance-assets/manifest.json').resolve()
          data = json.loads(manifest.read_text())
          subprocess.run([
              sys.executable, 'scripts/run_acceptance.py',
              '--scenario', 'sgf-ui', '--scenario', 'real-cpu-engine',
              '--engine', data['katago']['executable']['path'], '--model', data['model']['path'],
              '--engine-config', data['config']['path'], '--engine-manifest', str(manifest),
              '--output', 'target/acceptance-integration', '--timeout', '900',
          ], check=True)
          PY
      - name: Verify clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Upload scoped execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-linux-sgf-cpu-${{ github.sha }}
          path: |
            target/acceptance-integration
            target/acceptance-assets/manifest.json
          if-no-files-found: warn
          retention-days: 14
