name: Publish Test Channel Pointer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub pre-release tag to sign onto the test channel
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: test-channel-pointer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release

    steps:
      - name: Confirm the packaged pre-release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^next-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout the release tooling
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check cryptography requests

      - name: Test the fail-closed release publisher
        run: python -m unittest scripts.test_r2_release

      - name: Publish the signed test-channel pointer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]]; then
            echo "UPDATE_SIGNING_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/lizzie-update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          python scripts/r2_release.py publish-test-channel \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "$RELEASE_TAG" \
            --private-key "$key_file" \
            --key-id stable-2026-08
          rm -f "$key_file"

      - name: Remove temporary signing key after failure
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/lizzie-update-signing-key.pem"
